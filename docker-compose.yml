services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: authdb, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  auth-service:
    build: { context: ., dockerfile: auth-service/Dockerfile }
    environment: { SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authdb, SPRING_DATASOURCE_USERNAME: app, SPRING_DATASOURCE_PASSWORD: app, JWT_SECRET: change-this-secret-in-production }
    depends_on: [postgres]
    ports: ["8081:8081"]
  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    depends_on: [auth-service]
    ports: ["8080:8080"]
volumes: { pgdata: {} }
